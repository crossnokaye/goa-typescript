name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/toy/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files requiring gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run vet (toy design)
        working-directory: examples/toy
        run: go vet ./design/...

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r type-check

  # Generated clients ask for `typescript ^5.7.0`, and consumers also run newer
  # majors. Type-check the runtime and compile every golden fixture on the
  # oldest supported release and on the latest one.
  type-check-typescript:
    name: type-check (typescript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.7.3', 'latest']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install TypeScript ${{ matrix.typescript }}
        run: pnpm --filter @goa-typescript/runtime add --save-dev typescript@${{ matrix.typescript }}

      - name: Type-check the runtime
        run: pnpm -r type-check

      - name: Type-check the golden fixtures
        run: go test -count=1 -run TestFixturesTypeCheck ./plugin/typescript/internal/tsgen

  # Generated clients ask for `zod ^4.1.0`, while the repo pins the latest zod.
  # Run the runtime tests and compile every golden fixture on the oldest
  # supported release.
  zod-floor:
    name: test (zod 4.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install zod 4.1
        run: pnpm --filter @goa-typescript/runtime add --save-dev zod@~4.1.0

      - name: Type-check and test the runtime
        run: pnpm -r type-check && pnpm -r test

      - name: Type-check the golden fixtures
        run: go test -count=1 -run TestFixturesTypeCheck ./plugin/typescript/internal/tsgen

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/toy/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run runtime tests
        run: pnpm -r test

      - name: Run tests
        run: go test ./...
